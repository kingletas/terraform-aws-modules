version: 2

updates:
  # The workflows pin every action to a commit SHA, which is what stops a tag
  # being moved under us. A pin nothing ever bumps is a stale dependency nobody
  # notices, so this is the way back out: Dependabot reads the `# vX.Y.Z`
  # comment beside each SHA and opens a pull request that moves both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      all:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # Examples pin exact provider versions in their lock files; this keeps those
  # current. Modules declare a range and carry no lock file, so they need nothing.
  - package-ecosystem: terraform
    directories:
      - /examples/*
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    groups:
      providers:
        patterns: ["*"]
    open-pull-requests-limit: 2
