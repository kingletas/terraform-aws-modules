name: Release

# Tagging is the whole trigger: `git tag v1.2.3 && git push --tags` checks the
# changelog has a section for it, then publishes a GitHub Release whose body is
# that section.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.2.3)"
        required: true

permissions:
  contents: read

jobs:
  # The gate already runs on every push to main, so a tag on a commit main has
  # proved would run it a second time over an identical tree. Asked rather than
  # assumed: only a completed, successful CI run for this exact commit skips it.
  # A run still going, a failed lookup and a tag on an unproved commit all mean
  # run the gate, because the cheap answer must never be the one that skips it.
  proved:
    name: Has this commit already passed
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      already: ${{ steps.look.outputs.already }}
    steps:
      - name: Look for a successful CI run on this commit
        id: look
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # A lookup that fails must read as "not proved". `|| true` and the
          # digits test are what keep an error from being taken for a pass.
          count="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&status=completed" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success")] | length' \
            2>/dev/null || true)"
          case "$count" in
            '' | *[!0-9]*) count=0 ;;
          esac

          if [ "$count" -gt 0 ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "CI has already passed on ${SHA}. Not running it again."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "No completed, successful CI run for ${SHA}. Running the gate."
          fi

  # A release nobody proved is a release nobody should trust, so the tagged commit
  # passes the same gate every push does before anything is published.
  check:
    needs: proved
    if: needs.proved.outputs.already != 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [proved, check]
    # `always()` is needed only because a skipped dependency would otherwise
    # skip this too. The conditions are written as what must be true rather than
    # what must not, so a state nobody thought of stops the release.
    if: >-
      always() &&
      needs.proved.result == 'success' &&
      (needs.check.result == 'success' || needs.check.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out which version this is
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # A release with no notes is one nobody can read, so this stops here
          # rather than publishing an empty body.
          packaging/release-notes.sh "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.pick.outputs.version }}"
          packaging/release-notes.sh "$version" > notes.md
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "v${version} exists: updating its notes"
            gh release edit "v${version}" --title "terraform-aws-modules ${version}" --notes-file notes.md
          else
            gh release create "v${version}" --target "$GITHUB_SHA" \
              --title "terraform-aws-modules ${version}" --notes-file notes.md
          fi
